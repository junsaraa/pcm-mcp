apiVersion: v1
kind: ServiceAccount
metadata: {name: policy-engine, namespace: mcp-policy}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: read-server-pods, namespace: mcp-servers}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: engine-reads-servers, namespace: mcp-servers}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: read-server-pods}
subjects:
  - {kind: ServiceAccount, name: policy-engine, namespace: mcp-policy}
